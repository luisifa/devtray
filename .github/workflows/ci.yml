name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux and Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux dbus-x11 python3-venv python3-gi libegl1 libopengl0 libxkbcommon0 fonts-noto-cjk
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install PySide6
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.97.1
      - name: Check Rust
        run: |
          cargo fmt --all -- --check
          cargo test --locked
          cargo clippy --locked -- -D warnings
          cargo build --locked
      - name: Check CLI, MCP, Qt, tmux, and tray integration
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 tests/native_inventory.py
          python3 tests/mcp.py
          python3 tests/interaction_fixes.py
          python3 tests/service_alerts.py
          python3 tests/keyboard_interaction.py
          python3 tests/resource_workspace.py
          python3 tests/panel_assets.py
          python3 tests/git_workspace.py
          python3 tests/agents_skills.py
          python3 tests/skills_check.py
          python3 tests/skills_install.py
          python3 tests/skills_write.py
          python3 tests/disk_clean.py
          python3 tests/test_panel.py
          python3 tests/panel_instance.py
          python3 tests/log_restart.py
          python3 tests/launch_shortcuts.py
          dbus-run-session -- python3 tests/tray_context_menu.py

  linux-packages:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools libarchive-tools
          rustup toolchain install 1.97.1 --profile minimal --component rust-docs --target x86_64-unknown-linux-musl
          rustup override set 1.97.1
          cargo install cargo-deb --version 3.8.0 --locked
          cargo install cargo-generate-rpm --version 0.21.0 --locked
      - name: Build Linux packages
        run: |
          ./scripts/package-release.sh
          python3 tests/package_licenses.py
      - uses: actions/upload-artifact@v4
        with:
          name: devtray-linux-x86_64
          path: dist/*
          if-no-files-found: error

  desktop-probe:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macos-arm64-cli
            binary: target/aarch64-apple-darwin/debug/devtray
          - os: windows-2025
            label: windows-x64-native
            binary: target/x86_64-pc-windows-msvc/debug/devtray.exe
    name: probe / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'macOS'
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustc +1.97.1 -vV
          cargo +1.97.1 check --locked --all-targets --target aarch64-apple-darwin
          cargo +1.97.1 build --locked --target aarch64-apple-darwin
      - if: runner.os == 'Windows'
        name: Build native Windows CLI
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.97.1 build --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./target/x86_64-pc-windows-msvc/debug/devtray.exe capabilities
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check native inventory without WSL or service configuration
        env:
          DEVTRAY_TEST_BINARY: ${{ matrix.binary }}
        run: python tests/native_inventory.py
      - if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install -r packaging/desktop/requirements-win.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/desktop_panel_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
